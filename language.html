  .scrim {
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,16,16,0.55) 0%, rgba(20,16,16,0.75) 60%, rgba(10,8,8,0.92) 100%);
  }

  .content {
    position:relative;
    z-index:2;
    padding:40px 24px;
    max-width:520px;
  }

  .logo {
    width:150px;
    height:auto;
    margin:0 auto 36px;
    display:block;
  }

  .tagline {
    font-family:'Fira Code',monospace;
    font-size:12px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--rose);
    margin-bottom:48px;
  }

  .choices {
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .choice {
    display:block;
    padding:18px 40px;
    border:1.5px solid rgba(255,255,255,0.7);
    color:var(--white);
    text-decoration:none;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:700;
    letter-spacing:0.14em;
    text-transform:uppercase;
    transition:background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    min-width:160px;
  }

  .choice:hover {
    background:var(--rose);
    border-color:var(--rose);
    color:var(--black);
  }

  .sub {
    margin-top:44px;
    font-family:'Fira Code',monospace;
    font-size:11px;
    color:rgba(255,255,255,0.4);
    letter-spacing:0.05em;
  }

  @media (max-width:480px) {
    .choices { flex-direction:column; align-items:center; }
    .choice { width:220px; }
  }
</style>
